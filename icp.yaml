canisters:
  - canisters/*/*

networks:
  - name: local
    mode: managed
    ii: true # local Internet Identity for offline dev and e2e sign-in tests

environments:
  - name: local
    network: local
    canisters: [site, web, accounting, vault]
  # Two more accounting + vault pairs on the local network for the backup/restore test (A9c):
  # `backup` is filled and backed up, `restore` is reinstalled empty and restored into.
  - name: backup
    network: local
    canisters: [accounting, vault]
  - name: restore
    network: local
    canisters: [accounting, vault]
  - name: ic
    network: ic
    canisters: [site, web, accounting, vault]
    settings:
      accounting:
        # Captured by the canister on first use; never change it afterwards (C16).
        environment_variables:
          VETKD_KEY_NAME: "key_1"
